<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop stop-color=%27%237c6cff%27/%3E%3Cstop offset=%271%27 stop-color=%27%23d46cff%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M16 6 8.5 9v6.6c0 4.6 3 8 7.5 9.7 4.5-1.7 7.5-5.1 7.5-9.7V9L16 6Z%27 fill=%27%23fff%27 fill-opacity=%27.25%27 stroke=%27%23fff%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27m12.6 15.8 2.6 2.6 4.8-5%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0d14">
<title>Staff Forum · Mod Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d14;--bg2:#10131c;--panel:#141824;--panel2:#191e2c;--line:#232a3b;--line2:#2e3750;
  --txt:#eef1f8;--mut:#8a93a8;--dim:#5d6578;--acc:#7c6cff;--acc2:#a78bfa;
  --accg:linear-gradient(135deg,#7c6cff 0%,#b06cff 100%);--ban:#ff4d6d;--r:14px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:14.5px/1.5 Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(124,108,255,.16),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(176,108,255,.10),transparent 60%)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}
.shell{max-width:1100px;margin:auto;padding:28px 28px 70px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:800}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accg);display:grid;place-items:center;font-size:19px}
.back{color:var(--mut);text-decoration:none;font-weight:600}.back:hover{color:var(--txt)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
.top p{margin:5px 0 0;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font:600 14px Inter,sans-serif;color:#fff;background:var(--accg);box-shadow:0 6px 20px -6px rgba(124,108,255,.6)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:var(--panel2);box-shadow:none;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:rgba(255,77,109,.12);color:#ff7d93;border:1px solid rgba(255,77,109,.3);box-shadow:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--txt);border-radius:10px;padding:11px 13px;outline:0}
.search input{padding-left:40px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
select{width:auto;min-width:160px}
.list{display:grid;gap:10px}
.topic{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.topic:hover{border-color:var(--line2);transform:translateY(-1px)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;background:var(--panel2);object-fit:cover}
.topic-main{flex:1;min-width:0}
.topic h3{font-size:16px;margin:0 0 5px;font-weight:700}
.desc{color:#c5ccda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:9px}
.cat{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;background:rgba(124,108,255,.14);color:var(--acc2)}
.empty{padding:55px 20px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);color:var(--mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.panel h2{font-size:21px;margin:0 0 5px}
.sub{color:var(--mut);font-size:12px}
.post{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post-content{flex:1;min-width:0}
.post-head{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:6px}
.post-head b{color:var(--txt);font-size:13px}
.post p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:#d5dae6}
.form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:760px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
textarea{min-height:150px;resize:vertical}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.error{color:#ff7d93;font-size:13px;min-height:1em;margin-top:10px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid #34d399;border-radius:10px;padding:11px 16px;box-shadow:0 10px 30px #0006}
@media(max-width:650px){.shell{padding:18px 14px 50px}.topic{padding:12px}.avatar{width:34px;height:34px}.panel,.form{padding:15px}.top h1{font-size:23px}}

/* ============================================================
   couche de design partagée (index.html + forum.html)
   Chargée APRÈS le <style> de chaque page : elle affine, ne remplace pas.
   Respecte les réglages utilisateur : --acc / --acc2 / --accg,
   body.noglow, body.nomotion, body.dense, --fs.
   ============================================================ */

:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --glass:color-mix(in srgb,var(--panel) 72%,transparent);
  --edge:color-mix(in srgb,#fff 7%,transparent);
  --glow:color-mix(in srgb,var(--acc,#7c6cff) 35%,transparent);
  --sh-lg:0 24px 60px -24px rgba(0,0,0,.75),0 2px 0 0 var(--edge) inset;
}

html{scroll-behavior:smooth;color-scheme:dark}
::selection{background:color-mix(in srgb,var(--acc,#7c6cff) 45%,transparent);color:#fff}

/* ---------- scrollbars ---------- */
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:padding-box;border:2px solid transparent}

/* ---------- ambiance : aurore + grain ---------- */
body{position:relative}
body::before{
  background:
    radial-gradient(800px 480px at 88% -8%,color-mix(in srgb,var(--acc,#7c6cff) 22%,transparent),transparent 62%),
    radial-gradient(640px 420px at -8% 108%,color-mix(in srgb,var(--acc,#7c6cff) 14%,#ff6cf0 40%) ,transparent 62%),
    radial-gradient(500px 300px at 50% 50%,color-mix(in srgb,var(--acc,#7c6cff) 4%,transparent),transparent 70%)!important;
  animation:aurora 22s ease-in-out infinite alternate;
}
body::after{ /* grain léger */
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes aurora{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2%,1.5%,0) scale(1.06)}}
body.noglow::before,body.noglow::after{display:none}

/* ---------- boutons ---------- */
.btn{
  position:relative;overflow:hidden;isolation:isolate;letter-spacing:.005em;
  background:var(--accg);
  box-shadow:0 8px 24px -8px var(--glow),0 1px 0 0 rgba(255,255,255,.28) inset;
  transition:transform .25s var(--ease),filter .2s,box-shadow .25s var(--ease),background .2s,border-color .2s;
}
.btn::after{ /* reflet qui traverse au survol */
  content:"";position:absolute;inset:0;z-index:-1;transform:translateX(-120%) skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  transition:transform .6s var(--ease);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px var(--glow),0 1px 0 0 rgba(255,255,255,.3) inset}
.btn:hover::after{transform:translateX(120%) skewX(-18deg)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghost,.btn.danger,.btn.ok{box-shadow:none}
.btn.ghost::after,.btn.danger::after,.btn.ok::after{display:none}
.btn.ghost{background:var(--glass);backdrop-filter:blur(8px)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--acc,#7c6cff) 45%,var(--line2));box-shadow:0 8px 22px -12px var(--glow)}
.btn.discord{background:linear-gradient(135deg,#5865F2,#7983f5);box-shadow:0 10px 28px -8px rgba(88,101,242,.85),0 1px 0 0 rgba(255,255,255,.25) inset}
.icon-btn{transition:background .2s,color .2s,transform .2s var(--ease)}
.icon-btn:hover{transform:scale(1.08)}

:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--acc,#7c6cff);outline-offset:2px;border-radius:10px;
}

/* ---------- champs ---------- */
input,select,textarea{
  background:color-mix(in srgb,var(--bg2) 85%,transparent);
  transition:border-color .2s,box-shadow .25s var(--ease),background .2s;
}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{
  border-color:var(--acc,#7c6cff);background:var(--bg2);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc,#7c6cff) 18%,transparent),0 8px 24px -12px var(--glow);
}
input::placeholder,textarea::placeholder{color:var(--dim)}

/* ---------- surfaces : verre + bordure dégradée + spotlight ---------- */
.stat,.log,.mem,.qz,.sub,.card,.set-sec,.ann-card,.forum-side,.forum-chat,.modal,.profile-pop,
.topic,.panel,.form,.me,.auth,.emoji-picker{
  background-color:var(--glass);
  border-color:var(--line);
  box-shadow:var(--sh-lg);
}
.stat,.log,.mem,.qz,.sub,.ann-card,.topic,.panel,.card,.form{
  --mx:50%;--my:0%;
  background-image:radial-gradient(420px circle at var(--mx) var(--my),color-mix(in srgb,var(--acc,#7c6cff) 11%,transparent),transparent 45%);
  transition:transform .35s var(--ease),border-color .25s,box-shadow .35s var(--ease),background-color .25s;
}
.stat:hover,.log:hover,.mem:hover,.qz:hover,.ann-card:hover,.topic:hover{
  border-color:color-mix(in srgb,var(--acc,#7c6cff) 40%,var(--line2));
  transform:translateY(-3px);
  box-shadow:0 22px 44px -22px rgba(0,0,0,.8),0 0 0 1px color-mix(in srgb,var(--acc,#7c6cff) 14%,transparent),0 2px 0 0 var(--edge) inset;
}
.log:hover{transform:translateY(-2px)}
.card:hover,.form:hover,.panel:hover,.sub:hover{border-color:var(--line2)}

/* ---------- écrans d'auth ---------- */
.auth{
  position:relative;border-radius:24px;padding:42px 34px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 80%,transparent),color-mix(in srgb,var(--panel) 80%,transparent));
  backdrop-filter:blur(22px) saturate(140%);
  animation:rise .7s var(--ease) both;
}
.auth::before{ /* liseré dégradé */
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc,#7c6cff) 70%,transparent),transparent 40%,transparent 60%,color-mix(in srgb,var(--acc,#7c6cff) 35%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
}
.auth h1{background:linear-gradient(180deg,#fff,#b9c0d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{
  box-shadow:0 12px 34px -8px var(--glow),0 1px 0 0 rgba(255,255,255,.35) inset;
  animation:float 5s ease-in-out infinite;
}
.brand .logo{animation:none;box-shadow:0 8px 22px -8px var(--glow),0 1px 0 0 rgba(255,255,255,.3) inset}
@keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ---------- navigation ---------- */
aside{
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 82%,transparent),color-mix(in srgb,var(--bg) 82%,transparent));
  backdrop-filter:blur(18px) saturate(130%);
  border-right-color:color-mix(in srgb,#fff 6%,transparent);
}
.brand{font-size:16.5px;letter-spacing:-.015em}
.nav{position:relative;border-radius:11px;transition:background .2s,color .2s,transform .25s var(--ease),padding .25s var(--ease)}
.nav:hover{transform:translateX(3px)}
.nav svg{transition:transform .3s var(--ease),color .2s}
.nav:hover svg{transform:scale(1.15) rotate(-6deg)}
.nav.on{box-shadow:0 8px 24px -14px var(--glow)}
.nav.on::before{ /* barre active */
  content:"";position:absolute;left:-14px;top:22%;bottom:22%;width:3px;border-radius:0 4px 4px 0;
  background:var(--accg);box-shadow:0 0 12px var(--glow);
}
.nav .count{box-shadow:0 0 0 3px color-mix(in srgb,var(--ban) 20%,transparent);animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.me{border-radius:16px;transition:transform .3s var(--ease),border-color .2s}
.me:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc,#7c6cff) 40%,var(--line2))}
.me img,.log .av,.mem img,.forum-msg .av,.sub .av,.avatar{transition:transform .3s var(--ease),box-shadow .3s}
.log:hover .av,.mem:hover img,.topic:hover .avatar{transform:scale(1.07);box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--c,var(--acc,#7c6cff)) 60%,transparent)}

/* ---------- titres de page ---------- */
.top h2,.top h1{
  font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--acc2,#a78bfa) 55%,#b8bfd3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
main>section,main>div[id],.shell main>section{animation:rise .55s var(--ease) both}

/* ---------- stats ---------- */
.stat{padding:18px 20px}
.stat .v{
  font-size:32px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c,var(--acc)) 45%,#cfd5e6));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat::after{width:120px;height:120px;right:-34px;top:-40px;opacity:.14;filter:blur(18px);transition:opacity .4s,transform .5s var(--ease)}
.stat:hover::after{opacity:.3;transform:scale(1.25)}
.stat .k{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}

/* ---------- logs ---------- */
.day{letter-spacing:.14em;font-size:11px;color:var(--mut)}
.day::after{background:linear-gradient(90deg,var(--line2),transparent)}
.log{padding:18px 18px 18px 20px}
.log::before{width:4px;box-shadow:0 0 18px var(--c);border-radius:0 4px 4px 0}
.badge{backdrop-filter:blur(4px);letter-spacing:.02em}
.target{background:color-mix(in srgb,var(--bg2) 80%,transparent);transition:border-color .2s}
.log:hover .target{border-color:color-mix(in srgb,var(--c,var(--acc)) 45%,var(--line))}
.thumbs img{border-radius:12px;transition:transform .35s var(--ease),border-color .2s,box-shadow .35s var(--ease)}
.thumbs img:hover{transform:scale(1.06) rotate(-.6deg);box-shadow:0 16px 32px -12px rgba(0,0,0,.8)}
.role{backdrop-filter:blur(4px)}
.role.owner{box-shadow:0 0 18px -4px rgba(251,191,36,.45)}

/* ---------- chips / onglets / segments ---------- */
.chip{transition:all .25s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chip.on{box-shadow:0 8px 20px -10px var(--c,var(--acc))}
.tabs{background:var(--glass);backdrop-filter:blur(10px)}
.tab{transition:background .2s,color .2s}
.tab:hover{color:var(--txt)}
.tab.on{background:linear-gradient(180deg,var(--panel2),color-mix(in srgb,var(--panel2) 70%,var(--bg2)));box-shadow:0 6px 16px -8px rgba(0,0,0,.7),0 1px 0 var(--line2) inset}
.act-opt{transition:all .25s var(--ease)}
.act-opt:hover{transform:translateY(-2px)}
.act-opt.on{transform:translateY(-2px)}
.drop{border-radius:16px;background:repeating-linear-gradient(135deg,transparent 0 12px,color-mix(in srgb,var(--acc,#7c6cff) 3%,transparent) 12px 24px);transition:all .3s var(--ease)}
.drop:hover,.drop.over{transform:scale(1.01);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc,#7c6cff) 10%,transparent)}
.opt{transition:all .2s}
.opt:hover{border-color:var(--line2);transform:translateX(2px)}

/* ---------- forums / annonces ---------- */
.forum-layout{gap:16px}
.forum-channel{position:relative;transition:all .22s var(--ease)}
.forum-channel:hover{transform:translateX(3px)}
.forum-channel.on{box-shadow:0 8px 22px -14px var(--glow)}
.forum-msg{border-radius:10px;transition:background .2s;margin:0 -8px;padding:10px 8px}
.forum-msg:hover{background:color-mix(in srgb,#fff 2.5%,transparent)}
.forum-compose{background:color-mix(in srgb,var(--bg2) 55%,transparent);backdrop-filter:blur(8px)}
.forum-feed{scroll-behavior:smooth}
.ann-card{border-radius:16px}

/* ---------- quiz ---------- */
.qtimer{backdrop-filter:blur(14px);box-shadow:0 16px 36px -18px rgba(0,0,0,.8)}
.qtimer .bar i{background:var(--accg);box-shadow:0 0 12px var(--glow)}

/* ---------- réglages ---------- */
.set-sec{border-radius:20px}
.sw span{transition:background .25s}
.pack{transition:all .25s var(--ease)}
.pack:hover{transform:translateY(-3px)}

/* ---------- modales, toasts, lightbox ---------- */
.modal-bg,.profile-pop-bg,.lb{backdrop-filter:blur(10px) saturate(120%)}
.modal,.profile-pop,.emoji-picker{
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 94%,transparent),color-mix(in srgb,var(--panel) 96%,transparent));
  animation:modalIn .4s var(--ease) both;box-shadow:0 40px 80px -30px #000,0 0 0 1px color-mix(in srgb,#fff 6%,transparent);
}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.profile-pop-banner{position:relative}
.profile-pop-banner::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,var(--panel))}
.profile-pop-avatar{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc,#7c6cff) 60%,transparent),0 10px 24px -8px #000}
.lb img{animation:modalIn .35s var(--ease) both}
.toast{
  backdrop-filter:blur(14px);background:color-mix(in srgb,var(--panel2) 90%,transparent);
  box-shadow:0 18px 40px -16px #000,0 0 22px -8px color-mix(in srgb,var(--unban,#34d399) 50%,transparent);
  animation:toastIn .45s var(--ease) both;
}
.toast.bad{box-shadow:0 18px 40px -16px #000,0 0 22px -8px color-mix(in srgb,var(--ban,#ff4d6d) 55%,transparent)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.95)}to{opacity:1;transform:none}}

/* ---------- squelette de chargement ---------- */
.skel{border:1px solid var(--line);background:linear-gradient(100deg,var(--panel) 20%,color-mix(in srgb,var(--panel2) 140%,var(--acc) 6%) 50%,var(--panel) 80%);background-size:250% 100%}

/* ---------- états vides ---------- */
.empty,.forum-empty{
  border-radius:20px;border-color:var(--line2);
  background:radial-gradient(320px 160px at 50% 0%,color-mix(in srgb,var(--acc,#7c6cff) 8%,transparent),transparent 70%);
}
.empty svg{animation:float 4s ease-in-out infinite}

/* ---------- forum.html : header & liste ---------- */
.header{padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--sh-lg)}
.back{padding:7px 12px;border-radius:9px;transition:all .25s var(--ease)}
.back:hover{background:var(--panel2);transform:translateX(-3px)}
.topic{border-radius:16px;padding:18px}
.topic h3{letter-spacing:-.01em}
.cat{letter-spacing:.03em;border:1px solid color-mix(in srgb,var(--acc,#7c6cff) 28%,transparent)}
.post{transition:background .2s;border-radius:10px;margin:0 -8px;padding:15px 8px}
.post:hover{background:color-mix(in srgb,#fff 2.5%,transparent)}
.search span{pointer-events:none}

/* ---------- entrée en cascade des listes ---------- */
.list>*,.members>*,.ann-list>*,#logList>*,.stats>*{animation:rise .5s var(--ease) both}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(1){animation-delay:.02s}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(2){animation-delay:.06s}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(3){animation-delay:.10s}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(4){animation-delay:.14s}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(5){animation-delay:.18s}
:is(.list,.members,.ann-list,#logList,.stats)>*:nth-child(n+6){animation-delay:.22s}

/* ---------- mobile ---------- */
@media(max-width:760px){
  .mnav{background:color-mix(in srgb,var(--bg2) 88%,transparent)!important;backdrop-filter:blur(20px) saturate(150%);border-top-color:color-mix(in srgb,#fff 8%,transparent)!important}
  .mnav .nav:hover{transform:none}
  .mnav .nav.on::before{left:30%;right:30%;top:-9px;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
  .mnav{overflow-x:auto;gap:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .mnav::-webkit-scrollbar{display:none}
  .mnav .nav{flex:0 0 auto!important;width:auto!important;min-width:68px!important;scroll-snap-align:center}
  .mnav .nav.on{background:color-mix(in srgb,var(--acc,#7c6cff) 16%,transparent)}
  .auth{padding:34px 22px}
  .stat .v{font-size:28px}
  .header{padding:8px 10px}
}

/* ---------- accessibilité / réglages utilisateur ---------- */
@media(hover:none){
  .stat:hover,.log:hover,.mem:hover,.qz:hover,.ann-card:hover,.topic:hover,.nav:hover,.btn:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important;transition:none!important}

/* ============================================================
   Jeu d'icônes duotone (symboles SVG) + logos
   ============================================================ */
svg{flex:none}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.22em;margin-right:.45em;color:var(--acc2,#a78bfa)}
svg.ic.big{width:1.35em;height:1.35em}
.set-sec h3{display:flex;align-items:center}
.set-sec h3 svg.ic{width:20px;height:20px;margin-right:9px;padding:3px;box-sizing:content-box;border-radius:9px;background:color-mix(in srgb,var(--acc,#7c6cff) 16%,transparent)}
.qtimer svg.ic,.qwatch svg.ic{margin-right:0;color:inherit}
.btn svg,.back svg{width:1.15em;height:1.15em;margin:0}
.btn svg.ic{color:inherit;margin-right:0}
.search span{display:grid;place-items:center;width:18px;height:18px}
.search span svg{width:18px;height:18px}
.forum-msg .profile-pop-status svg{margin-right:.4em}
.profile-pop-status svg.ic{color:var(--mut)}
.repl{display:inline-flex;align-items:center;gap:5px}
.repl svg{width:14px;height:14px;margin:0;color:var(--acc2,#a78bfa)}

/* logo : tuile dégradée, reflet de verre, symbole blanc */
.logo{position:relative;color:#fff;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.38),transparent 45%,rgba(0,0,0,.18));pointer-events:none}
.logo svg{width:58%;height:58%;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));position:relative;z-index:1}
.brand .logo svg{width:60%;height:60%}
.header .brand .logo{width:38px;height:38px}

/* icônes d'action : léger relief sur survol */
.icon-btn svg,.nav svg,.act-opt svg{transition:transform .3s var(--ease),color .2s,filter .2s}
.act-opt.on svg,.nav.on svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c,var(--acc,#7c6cff)) 70%,transparent))}
.stat .k svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c,var(--acc)) 55%,transparent))}
.icon-btn:hover svg{transform:scale(1.1)}
.empty svg{width:48px;height:48px}

/* correctif : cartes « Sound pack » étirées en hauteur */
.packs{grid-auto-rows:min-content;align-items:start;align-content:start;flex:none;height:auto;min-height:0}
.pack{height:auto;min-height:0}
.set-row.col{flex-wrap:nowrap}


/* ============================================================
   Thème « pro » — sobre, net, sans effets décoratifs.
   Chargé en dernier : il remplace la couche d'ambiance précédente.
   Respecte --acc / --acc2, --fs, body.dense et le thème clair.
   ============================================================ */
:root{
  --bg:#0a0b0f;--bg2:#0f1116;--panel:#13151b;--panel2:#181b23;--line:#23262f;--line2:#303440;
  --txt:#e9ebf0;--mut:#8b90a0;--dim:#5f6475;--r:12px;
  --glass:var(--panel);--glow:transparent;--edge:transparent;--sh-lg:0 1px 2px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#f6f7f9;--bg2:#f0f1f4;--panel:#fff;--panel2:#f3f4f7;--line:#e3e5eb;--line2:#d3d6df;
  --txt:#1a1d27;--text:#1a1d27;--mut:#667085;--dim:#98a2b3;--sh-lg:0 1px 2px rgba(16,24,40,.07);
}
body{background:var(--bg);letter-spacing:-.003em;font-feature-settings:"cv11","ss01","tnum"}
body::before{background:none!important;animation:none}
body::after{display:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
main>section,main>div[id],.shell main>section{animation:fadein .18s ease both}
.auth,.logo{animation:none}

/* surfaces */
.stat,.log,.mem,.qz,.sub,.card,.set-sec,.ann-card,.forum-side,.forum-chat,.topic,.panel,.form,.me{
  background:var(--panel);background-image:none;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh-lg);backdrop-filter:none;
}
.stat:hover,.log:hover,.mem:hover,.qz:hover,.ann-card:hover,.topic:hover,.me:hover,
.card:hover,.form:hover,.panel:hover,.sub:hover{transform:none;border-color:var(--line2);box-shadow:var(--sh-lg)}
.modal,.profile-pop,.emoji-picker{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 24px 64px -16px rgba(0,0,0,.65);backdrop-filter:none}
.modal-bg,.profile-pop-bg,.lb{backdrop-filter:blur(4px)}
.auth{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px;
  backdrop-filter:none;box-shadow:0 24px 64px -24px rgba(0,0,0,.6)}
.auth::before{display:none}
.auth h1,.top h1,.top h2{background:none;color:var(--txt);-webkit-text-fill-color:currentColor}
.auth h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.logo{box-shadow:none;border-radius:10px}

/* titres de page */
.top{padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.top h1,.top h2{font-size:22px;font-weight:650;letter-spacing:-.02em}
.top p{color:var(--mut);font-size:13.5px}
.header{align-items:center;padding:12px 16px;margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);backdrop-filter:none}
main{padding:28px 40px 80px;max-width:1120px}

/* navigation */
aside{background:var(--bg2);backdrop-filter:none;border-right:1px solid var(--line);padding:16px 12px;gap:2px}
.app{grid-template-columns:244px 1fr}
.brand{padding:6px 10px 16px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:8px;box-shadow:none}
.nav{border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:500;gap:10px;transform:none}
.nav svg{width:17px;height:17px;transition:color .15s}
.nav:hover{transform:none;background:var(--panel2);color:var(--txt)}
.nav:hover svg{transform:none}
.nav.on{background:var(--panel2);border-color:transparent;box-shadow:none;color:var(--txt)}
.nav.on::before{left:-12px;top:20%;bottom:20%;width:3px;box-shadow:none;background:var(--acc)}
.nav .count{animation:none;box-shadow:none;font-size:10.5px;padding:1px 6px}
.me .ban{height:40px}

/* boutons */
.btn{border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;letter-spacing:0;background:var(--acc);
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 1px 2px rgba(0,0,0,.35);transition:background .15s,border-color .15s,filter .15s}
.btn::after{display:none}
.btn:hover{transform:none;filter:brightness(1.1);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 1px 2px rgba(0,0,0,.35)}
.btn:active{transform:scale(.98)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);backdrop-filter:none;box-shadow:none}
.btn.ghost:hover{background:var(--line);border-color:var(--line2);filter:none;box-shadow:none}
.btn.danger,.btn.ok{box-shadow:none}
.btn.discord{background:#5865f2;box-shadow:0 1px 0 rgba(255,255,255,.2) inset}
.icon-btn:hover{transform:none}

/* champs */
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{background:var(--bg2);border-color:var(--acc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc,#7c6cff) 22%,transparent)}
.field label,label{font-size:12.5px;font-weight:600;color:var(--mut)}

/* stats */
.stat{padding:16px 18px}
.stat::after{display:none}
.stat .k{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--mut)}
.stat .v{font-size:26px;font-weight:650;letter-spacing:-.02em;background:none;color:var(--txt);-webkit-text-fill-color:currentColor}

/* logs */
.day{letter-spacing:.08em;font-weight:600}
.log{padding:16px 18px 16px 20px}
.log::before{width:3px;box-shadow:none}
.log:hover .av,.mem:hover img,.topic:hover .avatar{transform:none;box-shadow:none}
.thumbs img{border-radius:8px}
.thumbs img:hover{transform:none;box-shadow:none;border-color:var(--line2)}

/* chips, onglets, pastilles */
.chip{padding:6px 12px;border-radius:8px;background:var(--panel)}
.chip:hover{transform:none;border-color:var(--line2);color:var(--txt)}
.chip.on{box-shadow:none}
.tabs{background:var(--bg2);backdrop-filter:none;border-radius:10px}
.tab.on{background:var(--panel2);box-shadow:0 0 0 1px var(--line2)}
.act-opt:hover,.act-opt.on{transform:none}
.drop{background:var(--bg2);border-radius:12px}
.drop:hover,.drop.over{transform:none;box-shadow:none;border-color:var(--acc)}
.opt:hover,.forum-channel:hover{transform:none}
.forum-channel.on{box-shadow:none}
.role{backdrop-filter:none;font-size:10.5px;padding:2px 8px}
.role.owner,.role.developer{box-shadow:none}
.badge{backdrop-filter:none}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" fill-opacity=".2" stroke="none" d="M4 6.6A2.6 2.6 0 0 1 6.6 4h10.8A2.6 2.6 0 0 1 20 6.6v7.8a2.6 2.6 0 0 1-2.6 2.6H11l-4.4 3.5V17A2.6 2.6 0 0 1 4 14.4V6.6Z"/><path d="M4 6.6A2.6 2.6 0 0 1 6.6 4h10.8A2.6 2.6 0 0 1 20 6.6v7.8a2.6 2.6 0 0 1-2.6 2.6H11l-4.4 3.5V17A2.6 2.6 0 0 1 4 14.4V6.6Z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></symbol><symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor" fill-opacity=".2" stroke="none"/><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M12 8v8M8 12h8"/></symbol><symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".2" stroke="none"/><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9"/></symbol><symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5m5.5-6-6 6 6 6"/></symbol><symbol id="i-reply" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7 4 12l5.5 5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></symbol><symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" fill-opacity=".2" stroke="none" d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 0 0-13 0c0 5.4 6.5 11 6.5 11Z"/><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 0 0-13 0c0 5.4 6.5 11 6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol></defs></svg>
<div class="shell">
  <header class="header">
    <div class="brand"><div class="logo"><svg class=""><use href="#i-chat"/></svg></div><span>Staff Forum</span></div>
    <a class="back" href="/"><svg class="ic"><use href="#i-back"/></svg>Back to Mod Panel</a>
  </header>

  <main>
    <section id="indexView">
      <div class="top">
        <div><h1>Staff Logs Forum</h1><p>Team reports, activity logs and system discussions.</p></div>
        <button class="btn" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg>New topic</button>
      </div>
      <div class="toolbar">
        <div class="search"><span><svg class=""><use href="#i-search"/></svg></span><input id="query" placeholder="Search topics, people or messages…"></div>
        <select id="category">
          <option value="All">All categories</option><option>Staff</option><option>Moderation</option>
          <option>Server</option><option>Errors</option><option>System</option>
        </select>
      </div>
      <div class="list" id="topicList"></div>
    </section>

    <section id="composeView" class="hide">
      <div class="top"><div><h1>New topic</h1><p>Create a staff discussion or log report.</p></div></div>
      <form class="form" id="composeForm">
        <div class="field"><label for="title">Title</label><input id="title" maxlength="120" placeholder="e.g. Staff activity report" required></div>
        <div class="field"><label for="newCategory">Category</label>
          <select id="newCategory"><option>Staff</option><option>Moderation</option><option>Server</option><option>Errors</option><option>System</option></select>
        </div>
        <div class="field"><label for="message">Message / log details</label><textarea id="message" maxlength="5000" placeholder="Write your report or discussion…" required></textarea></div>
        <div class="error" id="composeError"></div>
        <div class="form-foot"><button type="button" class="btn ghost" id="cancelCompose">Cancel</button><button class="btn" id="publishBtn">Publish topic</button></div>
      </form>
    </section>

    <section id="threadView" class="hide">
      <button class="btn ghost" id="backBtn" style="margin-bottom:12px"><svg class="ic"><use href="#i-back"/></svg>Back to topics</button>
      <div id="threadContent"></div>
      <form class="form" id="replyForm">
        <div class="field"><label for="reply">Write a reply</label><textarea id="reply" maxlength="3000" placeholder="Add a comment…" required></textarea></div>
        <div class="error" id="replyError"></div>
        <div class="form-foot"><button class="btn" id="replyBtn">Send reply</button></div>
      </form>
    </section>
  </main>
</div>
<div id="toastArea"></div>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fallbackAvatar = "https://cdn.discordapp.com/embed/avatars/0.png";
let me = null, threads = [], active = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "same-origin",
    headers: options.body ? {"Content-Type":"application/json"} : undefined,
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  let data = null;
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) {
    const error = new Error(data?.error || "Request failed (" + response.status + ")");
    error.status = response.status;
    throw error;
  }
  return data;
}
function toast(message) {
  const node = document.createElement("div");
  node.className = "toast";
  node.textContent = message;
  $("toastArea").appendChild(node);
  setTimeout(() => node.remove(), 2800);
}
function date(value) {
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
function show(view) {
  ["indexView","composeView","threadView"].forEach(id => $(id).classList.toggle("hide", id !== view));
}
function renderList() {
  const q = $("query").value.trim().toLowerCase();
  const category = $("category").value;
  const filtered = threads.filter(t => (category === "All" || t.category === category) &&
    (!q || [t.title,t.body,t.author,t.category,...(t.replies || []).map(r => r.body+" "+r.author)].join(" ").toLowerCase().includes(q)));
  if (!filtered.length) {
    $("topicList").innerHTML = `<div class="empty">${threads.length ? "No topics match your search." : "No topics yet — start the first discussion."}</div>`;
    return;
  }
  $("topicList").innerHTML = filtered.map(t => `
    <article class="topic" data-id="${esc(t.id)}">
      <img class="avatar" src="${esc(t.avatar || fallbackAvatar)}" alt="">
      <div class="topic-main">
        <h3>${esc(t.title)}</h3>
        <div class="desc">${esc(t.body)}</div>
        <div class="meta"><b>${esc(t.author)}</b><span class="cat">${esc(t.category)}</span>
          <span class="repl"><svg class="ic"><use href="#i-reply"/></svg>${(t.replies || []).length} replies</span><span>${date(t.updatedAt || t.at)}</span>
        </div>
      </div>
    </article>`).join("");
}
async function load() {
  $("topicList").innerHTML = `<div class="empty">Loading topics…</div>`;
  try { threads = await api("/api/forum"); renderList(); }
  catch (error) {
    $("topicList").innerHTML = `<div class="empty">${esc(error.message)}${error.status === 401 ? " — sign in through the Mod Panel first." : ""}</div>`;
  }
}
function openThread(id) {
  active = threads.find(t => t.id === id);
  if (!active) return;
  show("threadView");
  const canDelete = me && (["owner", "developer", "admin"].includes(me.role) || active.uid === me.id);
  const posts = [{author:active.author,avatar:active.avatar,body:active.body,at:active.at},...(active.replies || [])];
  $("threadContent").innerHTML = `
    <article class="panel">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <span class="cat">${esc(active.category)}</span>
        ${canDelete ? `<button class="btn danger" id="deleteBtn">Delete topic</button>` : ""}
      </div>
      <h2 style="margin-top:14px">${esc(active.title)}</h2>
      <div class="sub">Started by ${esc(active.author)} · ${date(active.at)}</div>
      ${posts.map(p => `<div class="post"><img class="avatar" src="${esc(p.avatar || fallbackAvatar)}" alt="">
        <div class="post-content"><div class="post-head"><b>${esc(p.author)}</b><span>${date(p.at)}</span></div><p>${esc(p.body)}</p></div>
      </div>`).join("")}
    </article>`;
  $("reply").value = "";
  $("replyError").textContent = "";
  const del = $("deleteBtn");
  if (del) del.onclick = deleteThread;
}
async function deleteThread() {
  if (!active || !confirm("Delete this topic and all its replies?")) return;
  try {
    await api("/api/forum?id="+encodeURIComponent(active.id),{method:"DELETE"});
    toast("Topic deleted");
    active = null;
    await load();
    show("indexView");
  } catch (error) { toast(error.message); }
}
$("newBtn").onclick = () => { $("composeForm").reset(); $("composeError").textContent=""; show("composeView"); };
$("cancelCompose").onclick = () => show("indexView");
$("backBtn").onclick = () => { show("indexView"); };
$("query").addEventListener("input",renderList);
$("category").addEventListener("change",renderList);
$("topicList").addEventListener("click",event => {
  const card = event.target.closest("[data-id]");
  if (card) openThread(card.dataset.id);
});
$("composeForm").addEventListener("submit",async event => {
  event.preventDefault();
  $("composeError").textContent="";
  $("publishBtn").disabled=true;
  try {
    const created = await api("/api/forum",{method:"POST",body:{
      title:$("title").value,category:$("newCategory").value,body:$("message").value
    }});
    threads.unshift(created);
    toast("Topic published");
    renderList();
    show("indexView");
  } catch(error) { $("composeError").textContent=error.message; }
  finally { $("publishBtn").disabled=false; }
});
$("replyForm").addEventListener("submit",async event => {
  event.preventDefault();
  if (!active) return;
  $("replyError").textContent="";
  $("replyBtn").disabled=true;
  try {
    const updated = await api("/api/forum",{method:"POST",body:{id:active.id,body:$("reply").value}});
    threads = threads.map(t => t.id === updated.id ? updated : t);
    active = updated;
    openThread(updated.id);
    toast("Reply sent");
  } catch(error) { $("replyError").textContent=error.message; }
  finally { $("replyBtn").disabled=false; }
});
async function init() {
  try {
    const result = await api("/api/me");
    me = result.user;
    if (["pending","banned"].includes(me.role)) {
      document.querySelector("main").innerHTML = `<div class="empty">Your account does not have access to the staff forum.</div>`;
      return;
    }
    await load();
  } catch(error) {
    document.querySelector("main").innerHTML = `<div class="empty">Please <a href="/">sign in through the Mod Panel</a> to access the staff forum.</div>`;
  }
}
init();

/* spotlight qui suit la souris sur les cartes (léger, délégué, passif) */
(function () {
  if (matchMedia("(hover:none)").matches) return;
  var SEL = ".stat,.log,.mem,.qz,.sub,.ann-card,.topic,.panel,.card,.form";
  var raf = 0, ev = null;
  document.addEventListener("pointermove", function (e) {
    ev = e;
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      var el = ev.target && ev.target.closest && ev.target.closest(SEL);
      if (!el) return;
      var r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (ev.clientX - r.left) + "px");
      el.style.setProperty("--my", (ev.clientY - r.top) + "px");
    });
  }, { passive: true });
})();

</script>
