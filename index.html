<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal des mods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf5;--card:#fff;--ink:#16202f;--mute:#5d6b80;--line:#d3dbe8;--accent:#2f5bff;--accent-ink:#fff;--ok:#1f8a5b}
@media (prefers-color-scheme:dark){:root{--bg:#121a28;--card:#1b2536;--ink:#e8edf6;--mute:#93a1b8;--line:#2c3950;--accent:#6f8dff;--accent-ink:#0f1626;--ok:#52c796}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1}
.sub{color:var(--mute);margin:8px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
.search{margin-bottom:24px}
.feed{position:relative;padding-left:28px}
.feed:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.log{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.log:before{content:"";position:absolute;left:-23px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.top{display:flex;gap:12px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Bricolage Grotesque",sans-serif;flex:none}
.who{font-weight:600}.when{color:var(--mute);font-size:.85rem}
.tag{margin-left:auto;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.log h2{font-size:1.25rem;margin:14px 0 4px}
.note{margin:0;white-space:pre-wrap;color:var(--mute)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.empty,.err{text-align:center;color:var(--mute);padding:40px 0}.err{color:#d6454b}
dialog{border:0;border-radius:18px;padding:24px;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.6)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent)}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prev div{position:relative}.prev img{width:84px;height:60px;object-fit:cover;border-radius:8px}
.prev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#d6454b;color:#fff;cursor:pointer}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#lock{max-width:380px;margin:18vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
#lightbox img{max-width:92vw;max-height:88vh;border-radius:12px}
#lightbox{background:transparent;padding:0;width:auto}
</style>
</head>
<body>
<div id="lock" hidden>
  <h1 style="font-size:2rem">Espace des mods</h1>
  <p class="sub">Entre le mot de passe de l'équipe.</p>
  <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
  <p id="lockErr" class="err" style="padding:8px 0 0;text-align:left" hidden></p>
  <div class="row"><button class="btn" id="unlock">Entrer</button></div>
</div>

<main class="wrap" id="app" hidden>
  <header>
    <div><h1>Journal des mods</h1><p class="sub">Tout ce qui a été fait, avec les preuves.</p></div>
    <button class="btn" id="new">Créer un log</button>
  </header>
  <input class="search" id="q" placeholder="Chercher un mod, une cible, une action…" aria-label="Rechercher">
  <section class="feed" id="feed" aria-live="polite"></section>
</main>

<dialog id="dlg">
  <h2>Nouveau log</h2>
  <label for="mod">Ton nom de mod</label><input id="mod" maxlength="40">
  <label for="target">Cible (joueur, jeu, fichier…)</label><input id="target" maxlength="80" placeholder="ex. slbr uncopylocked">
  <label for="action">Action</label>
  <select id="action"><option>Unlock</option><option>Ban</option><option>Avertissement</option><option>Suppression</option><option>Autre</option></select>
  <label for="note">Détails</label><textarea id="note" rows="4" maxlength="2000" placeholder="Qu'est-ce qui s'est passé ?"></textarea>
  <label>Screenshots</label>
  <div class="drop" id="drop" tabindex="0">Clique, glisse ou colle (Ctrl+V) des images — 4 max</div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="prev" id="prev"></div>
  <p id="formErr" class="err" style="padding:8px 0 0;text-align:left" hidden></p>
  <div class="row"><button class="btn ghost" id="cancel">Annuler</button><button class="btn" id="save">Enregistrer le log</button></div>
</dialog>
<dialog id="lightbox"><img alt="Screenshot agrandi"></dialog>

<script>
const $=s=>document.querySelector(s);
let pw=localStorage.getItem("modpw")||"", logs=[], imgs=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

async function api(method,body){
  const r=await fetch("/api/logs",{method,headers:{"Content-Type":"application/json","x-mod-password":pw},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(d.error||"Erreur"),{status:r.status});
  return d;
}
async function load(){
  try{
    logs=await api("GET");
    $("#lock").hidden=true;$("#app").hidden=false;render();
  }catch(e){
    $("#app").hidden=true;$("#lock").hidden=false;
    if(pw){$("#lockErr").textContent=e.message;$("#lockErr").hidden=false}
  }
}
function render(){
  const q=$("#q").value.toLowerCase();
  const list=logs.filter(l=>[l.mod,l.target,l.action,l.note].join(" ").toLowerCase().includes(q));
  $("#feed").innerHTML=list.length?list.map(l=>`
  <article class="log">
    <div class="top">
      <div class="av" style="background:hsl(${hue(l.mod)} 55% 42%)">${esc(l.mod[0].toUpperCase())}</div>
      <div><div class="who">${esc(l.mod)}</div><div class="when">${new Date(l.at).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"})}</div></div>
      <span class="tag">${esc(l.action)}</span>
    </div>
    <h2>${esc(l.target)}</h2>
    ${l.note?`<p class="note">${esc(l.note)}</p>`:""}
    ${l.images&&l.images.length?`<div class="shots">${l.images.map(i=>`<img src="${i}" alt="Screenshot de ${esc(l.mod)}" loading="lazy">`).join("")}</div>`:""}
  </article>`).join(""):`<p class="empty">${logs.length?"Aucun résultat.":"Aucun log pour l'instant. Clique sur « Créer un log »."}</p>`;
}
$("#q").oninput=render;
$("#feed").onclick=e=>{if(e.target.tagName==="IMG"){$("#lightbox img").src=e.target.src;$("#lightbox").showModal()}};
$("#lightbox").onclick=()=>$("#lightbox").close();

$("#unlock").onclick=()=>{pw=$("#pw").value;localStorage.setItem("modpw",pw);load()};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#unlock").click()};

// compression d'image pour rester léger
function shrink(file){return new Promise(res=>{
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(file)})}
async function addFiles(files){
  for(const f of files){if(imgs.length>=4)break;if(f.type.startsWith("image/"))imgs.push(await shrink(f))}
  drawPrev();
}
function drawPrev(){
  $("#prev").innerHTML=imgs.map((s,i)=>`<div><img src="${s}" alt="Aperçu"><button data-i="${i}" aria-label="Retirer">×</button></div>`).join("");
}
$("#prev").onclick=e=>{if(e.target.dataset.i){imgs.splice(+e.target.dataset.i,1);drawPrev()}};
$("#drop").onclick=()=>$("#file").click();
$("#file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("#drop").ondragover=e=>{e.preventDefault();$("#drop").classList.add("over")};
$("#drop").ondragleave=()=>$("#drop").classList.remove("over");
$("#drop").ondrop=e=>{e.preventDefault();$("#drop").classList.remove("over");addFiles(e.dataTransfer.files)};
document.onpaste=e=>{if($("#dlg").open)addFiles([...e.clipboardData.files])};

$("#new").onclick=()=>{
  imgs=[];drawPrev();$("#target").value="";$("#note").value="";$("#formErr").hidden=true;
  $("#mod").value=localStorage.getItem("modname")||"";$("#dlg").showModal();
};
$("#cancel").onclick=()=>$("#dlg").close();
$("#save").onclick=async()=>{
  const mod=$("#mod").value.trim(),target=$("#target").value.trim();
  if(!mod||!target){$("#formErr").textContent="Mets ton nom et la cible.";$("#formErr").hidden=false;return}
  localStorage.setItem("modname",mod);$("#save").disabled=true;
  try{
    const l=await api("POST",{mod,target,action:$("#action").value,note:$("#note").value,images:imgs});
    logs.unshift(l);render();$("#dlg").close();
  }catch(e){$("#formErr").textContent=e.message;$("#formErr").hidden=false}
  $("#save").disabled=false;
};
load();
</script>
</body>
</html>
