<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mod area</title>
<style>
  :root{--bg:#131a26;--card:#1c2535;--line:#2a3548;--txt:#e8edf6;--mut:#8b98ad;--acc:#6f8cff;--bad:#e5484d;--ok:#3dd68c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  .center{min-height:100vh;display:grid;place-items:center;padding:16px}
  .center .card{width:100%;max-width:380px}
  h1{margin:0 0 6px;font-size:28px} h2{margin:0 0 14px;font-size:18px}
  p.mut,.mut{color:var(--mut)}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
  input,select,textarea{width:100%;background:#111826;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit}
  textarea{min-height:80px;resize:vertical}
  button,.btn{background:var(--acc);color:#0d1424;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  button.small{padding:5px 10px;font-size:13px}
  button.danger{background:var(--bad);color:#fff}
  .err{color:var(--bad);margin:10px 0 0;min-height:1em}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  header img{width:40px;height:40px;border-radius:50%}
  header .sp{flex:1}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .log{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .log:first-child{border-top:0}
  .log img.av{width:36px;height:36px;border-radius:50%;flex:none}
  .log .body{flex:1;min-width:0}
  .log .note{white-space:pre-wrap;word-break:break-word;margin-top:4px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .act{font-weight:700;color:var(--acc)}
  .urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .urow:first-child{border-top:0}
  .urow img{width:30px;height:30px;border-radius:50%}
  .urow .sp{flex:1}
  section{margin-bottom:20px}
  .hide{display:none!important}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="center hide">
  <div class="card">
    <h1>Mod area</h1>
    <p class="mut">Sign in with Discord to continue.</p>
    <a class="btn" href="/api/login">Sign in with Discord</a>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<!-- Pending / banned -->
<div id="blocked" class="center hide">
  <div class="card">
    <h1 id="blockedTitle"></h1>
    <p class="mut" id="blockedText"></p>
    <a class="btn ghost" href="/api/logout">Sign out</a>
  </div>
</div>

<!-- App -->
<div id="app" class="wrap hide">
  <header>
    <img id="meAv" alt="">
    <div><strong id="meName"></strong> <span class="tag" id="meRole"></span></div>
    <div class="sp"></div>
    <a class="btn ghost small" href="/api/logout">Sign out</a>
  </header>

  <section class="card hide" id="usersBox">
    <h2>Members</h2>
    <div id="users"></div>
  </section>

  <section class="card">
    <h2>New log</h2>
    <form id="form">
      <div class="row">
        <div><label>Target</label><input id="target" maxlength="80" placeholder="User or ID" required></div>
        <div><label>Action</label>
          <select id="action">
            <option>Warn</option><option>Mute</option><option>Kick</option><option>Ban</option><option>Unban</option><option>Other</option>
          </select>
        </div>
      </div>
      <label>Note</label><textarea id="note" maxlength="2000"></textarea>
      <label>Screenshots (up to 4)</label><input id="files" type="file" accept="image/*" multiple>
      <div style="margin-top:14px"><button type="submit">Save log</button></div>
      <div id="formErr" class="err"></div>
    </form>
  </section>

  <section class="card">
    <h2>Logs</h2>
    <div id="logs"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const show = (id) => ["login", "blocked", "app"].forEach((x) => $(x).classList.toggle("hide", x !== id));
let me = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    credentials: "same-origin",
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((data && data.error) || "Error " + r.status); e.status = r.status; throw e; }
  return data;
}

async function init() {
  try {
    me = (await api("/api/me")).user;
  } catch (e) {
    if (e.status === 401) return show("login");
    show("login"); $("loginErr").textContent = e.message; return;
  }
  if (me.role === "pending") {
    $("blockedTitle").textContent = "Waiting for approval";
    $("blockedText").textContent = "You are signed in as " + me.name + ". An admin has to approve your account first.";
    return show("blocked");
  }
  if (me.role === "banned") {
    $("blockedTitle").textContent = "Access removed";
    $("blockedText").textContent = "Your access to this area has been removed.";
    return show("blocked");
  }
  $("meAv").src = me.avatar; $("meName").textContent = me.name; $("meRole").textContent = me.role;
  const admin = me.role === "owner" || me.role === "admin";
  $("usersBox").classList.toggle("hide", !admin);
  show("app");
  loadLogs();
  if (admin) loadUsers();
}

async function loadLogs() {
  try {
    const logs = await api("/api/logs");
    $("logs").innerHTML = logs.length ? logs.map(renderLog).join("") : '<p class="mut">No logs yet.</p>';
  } catch (e) { $("logs").innerHTML = '<p class="err">' + esc(e.message) + "</p>"; }
}
function renderLog(l) {
  const can = me.role === "owner" || me.role === "admin" || l.uid === me.id;
  return `<div class="log">
    <img class="av" src="${esc(l.avatar)}" alt="">
    <div class="body">
      <div><strong>${esc(l.mod)}</strong> <span class="act">${esc(l.action)}</span> → ${esc(l.target)}
        <span class="mut"> · ${new Date(l.at).toLocaleString()}</span></div>
      ${l.note ? `<div class="note">${esc(l.note)}</div>` : ""}
      ${(l.images || []).length ? `<div class="thumbs">${l.images.map((s) => `<img src="${esc(s)}" onclick="window.open(this.src)">`).join("")}</div>` : ""}
    </div>
    ${can ? `<button class="small ghost" onclick="delLog('${esc(l.id)}')">Delete</button>` : ""}
  </div>`;
}
async function delLog(id) {
  if (!confirm("Delete this log?")) return;
  try { await api("/api/logs?id=" + encodeURIComponent(id), { method: "DELETE" }); loadLogs(); }
  catch (e) { alert(e.message); }
}

async function loadUsers() {
  try {
    const { users } = await api("/api/users");
    const order = { pending: 0, mod: 1, admin: 2, owner: 3, banned: 4 };
    users.sort((a, b) => (order[a.role] ?? 9) - (order[b.role] ?? 9));
    $("users").innerHTML = users.map((u) => {
      const btns = [];
      if (u.role !== "owner") {
        if (u.role === "pending" || u.role === "banned") btns.push(["approve", "Approve"]);
        if (u.role !== "banned") btns.push(["kick", "Remove"]);
        if (me.role === "owner" && u.role === "mod") btns.push(["promote", "Make admin"]);
        if (me.role === "owner" && u.role === "admin") btns.push(["demote", "Remove admin"]);
      }
      return `<div class="urow"><img src="${esc(u.avatar)}" alt=""><div class="sp"><strong>${esc(u.name)}</strong> <span class="mut">@${esc(u.username)}</span></div>
        <span class="tag">${esc(u.role)}</span>
        ${btns.map(([a, t]) => `<button class="small ghost" onclick="userAct('${esc(u.id)}','${a}')">${t}</button>`).join("")}</div>`;
    }).join("");
  } catch (e) { $("users").innerHTML = '<p class="err">' + esc(e.message) + "</p>"; }
}
async function userAct(id, action) {
  try { await api("/api/users", { method: "POST", body: { id, action } }); loadUsers(); }
  catch (e) { alert(e.message); }
}

// Shrink images so they fit under the server's size limit
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 1100, q = 0.8, out;
      const w0 = img.width, h0 = img.height;
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, max / Math.max(w0, h0));
        const c = document.createElement("canvas");
        c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 550000) break;
        max *= 0.8; q -= 0.08;
      }
      URL.revokeObjectURL(url);
      out.length < 600000 ? resolve(out) : reject(new Error("Image too large."));
    };
    img.onerror = () => reject(new Error("Could not read the image."));
    img.src = url;
  });
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("formErr").textContent = "";
  try {
    const files = [...$("files").files].slice(0, 4);
    const images = await Promise.all(files.map(shrink));
    await api("/api/logs", { method: "POST", body: { target: $("target").value, action: $("action").value, note: $("note").value, images } });
    $("form").reset();
    loadLogs();
  } catch (e) { $("formErr").textContent = e.message; }
});

init();
</script>
</body>
</html>
